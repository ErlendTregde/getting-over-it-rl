<title>Cold Start</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400&display=swap">
<style>
  /* One take: the network assembles itself, the pot arrives, and the whole
     thing comes alive on real data. Pure black so it luma-keys against the
     game capture; single theme by intent, because it is filmed. */
  :root { --ground: #000000; --ink: #e6ebf5; }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--ground);
    color: var(--ink);
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    overflow: hidden;
  }
  canvas { display: block; width: 100%; height: 100%; }
</style>

<canvas id="net"></canvas>

<script id="cap" type="application/json">/*__DATA__*/</script>
<script>
(function () {
  "use strict";
  const D = JSON.parse(document.getElementById("cap").textContent);
  const F = D.frames, N = F.length;
  const NB = D.rays_body;

  const player = new Image();
  let haveImg = false;
  player.onload = () => { haveImg = true; layout(); };
  player.src = "/*__PLAYER__*/";

  const RAY_IN = 8, HID = 10, OUT = 2;
  const IN = RAY_IN + 2;
  const rayPick = [];
  for (let i = 0; i < RAY_IN; i++) rayPick.push(Math.round(i * NB / RAY_IN));
  const hidPick = [];
  for (let i = 0; i < HID; i++) hidPick.push(Math.round(i * D.shown / HID));
  const OUT_LABELS = ["mouse x", "mouse y"];

  // Accent sampled from the pot itself (#E39B58 at its brightest), so the
  // signal reads as part of the same picture rather than an overlay.
  const HOT = "240,166,75", HEAD = "255,214,150",
        WIRE = "150,168,205", COOL = "170,182,208";

  // ---- the take, in seconds ---------------------------------------------
  // One layout throughout, so nothing jumps: the pieces fade in over it in
  // order, and the data only starts once the diagram is standing.
  const T = {
    colStart:  [0.35, 1.55, 2.55, 3.50],
    nodeStep:  [0.075, 0.055, 0.055, 0.22],
    nodeIn:    0.55,
    edgeStart: [2.15, 3.15, 4.05],
    edgeStep:  0.045,
    edgeIn:    0.85,
    labelAt:   4.20,
    // Deliberate pauses here. The assembled network is allowed to sit and be
    // read before anything else happens, and again before it wakes -- this is
    // for a video with time to spare, not a loading animation.
    potAt:     6.30,     // the pot arrives, a beat after the net is complete
    fanAt:     7.60,     // its lines reach the inputs
    liveAt:    9.40,     // real data starts
    liveIn:    2.40      // activation ramps in rather than snapping on
  };

  // Half speed. The run is 30 steps/s in the game; played back at 1x the
  // activations flicker past faster than anyone can follow them on screen.
  // NOTE: this breaks the frame-for-frame match with a game capture -- use
  // the Weights Only page for that, which stays at 1x on purpose.
  const PLAY_RATE = 0.5;

  const cv = document.getElementById("net");
  let ctx, W = 0, H = 0, cols = [], hub = { x: 0, y: 0 }, pbox = null;

  function fit() {
    const r = cv.getBoundingClientRect();
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    cv.width = Math.max(1, Math.round(r.width * dpr));
    cv.height = Math.max(1, Math.round(r.height * dpr));
    ctx = cv.getContext("2d");
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    W = r.width; H = r.height;
    layout();
  }

  function layout() {
    const gap = Math.min(44, (H - 100) / Math.max(IN, HID));
    const xs = [W * 0.235, W * 0.445, W * 0.655, W * 0.865];
    const counts = [IN, HID, HID, OUT];
    const radii = [10, 12, 12, 16];
    const spacing = [gap, gap, gap, gap * 2.6];
    cols = counts.map(function (n, c) {
      const s = spacing[c];
      const top = H / 2 - ((n - 1) * s) / 2;
      const pts = [];
      for (let i = 0; i < n; i++) pts.push({ x: xs[c], y: top + i * s, r: radii[c] });
      return pts;
    });
    const boxH = Math.min(H * 0.46, 340), boxW = W * 0.17;
    const ar = (haveImg && player.naturalHeight)
      ? player.naturalWidth / player.naturalHeight : 0.6;
    let pw = boxH * ar, ph = boxH;
    if (pw > boxW) { pw = boxW; ph = boxW / ar; }
    pbox = { w: pw, h: ph, x: W * 0.085, y: H / 2 };
    hub = { x: pbox.x + pw * 0.5 + 10, y: H / 2 };
  }
  addEventListener("resize", fit);
  fit();

  const clamp01 = v => v < 0 ? 0 : v > 1 ? 1 : v;
  const outBack = t => { const c = 1.35; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); };
  const outCubic = t => 1 - Math.pow(1 - t, 3);

  const SPEED_REF = 12;
  function acts(f) {
    const rays = rayPick.map(i => 1 - f.rays[i]);
    const speed = Math.min(1, Math.hypot(f.vel[0], f.vel[1]) / SPEED_REF);
    const swing = Math.min(1, Math.abs(f.tip[0]) / 3.2);
    return [
      rays.concat([speed, swing]),
      hidPick.map(i => f.h1[i]),
      hidPick.map(i => f.h2[i]),
      f.act.map(v => Math.abs(v))
    ];
  }

  // ---- firing pulses (only once the thing is live) -----------------------
  const pulses = [];
  const PULSE_LIFE = 4.4, MAX_PULSES = 2, SPAWN_RATE = 0.55;
  let spawnClock = 0;
  function spawn(A, dt) {
    if (pulses.length >= MAX_PULSES) return;
    spawnClock += dt * SPAWN_RATE;
    if (spawnClock < 1) return;
    spawnClock = 0;
    const cand = [];
    for (let c = 0; c < 3; c++) {
      for (let i = 0; i < cols[c].length; i++) {
        const s = A[c][i] || 0;
        if (s >= 0.55) cand.push({ c: c, i: i, w: s });
      }
    }
    if (!cand.length) return;
    let total = 0;
    for (const k of cand) total += k.w;
    let r = Math.random() * total;
    for (const k of cand) {
      r -= k.w;
      if (r <= 0) {
        pulses.push({ c: k.c, i: k.i,
                      j: Math.floor(Math.random() * cols[k.c + 1].length), t: 0 });
        return;
      }
    }
  }

  let t0 = performance.now(), last = t0, frame = 0, acc = 0, playing = true;
  const RATE = 30;

  function draw(t, dt) {
    ctx.clearRect(0, 0, W, H);
    const live = clamp01((t - T.liveAt) / T.liveIn);      // 0 -> 1 handover
    const f = F[frame];
    // activation is zero until the take goes live, then ramps in
    const raw = acts(f);
    const A = raw.map(col => col.map(v => (v || 0) * live));

    // ---- the pot, and its lines into the inputs -------------------------
    const pp = clamp01((t - T.potAt) / 1.6);
    if (haveImg && pp > 0) {
      ctx.globalAlpha = pp;
      ctx.drawImage(player, pbox.x - pbox.w / 2, pbox.y - pbox.h / 2,
                    pbox.w, pbox.h);
      ctx.globalAlpha = 1;
    }
    const fp = clamp01((t - T.fanAt) / 1.5);
    if (fp > 0) {
      const e = outCubic(fp);
      ctx.lineWidth = 1.15;
      for (let i = 0; i < cols[0].length; i++) {
        const n = cols[0][i], s = A[0][i] || 0;
        const ex = n.x - n.r - 3, ey = n.y;
        ctx.strokeStyle = s > 0.5
          ? "rgba(" + HOT + "," + (0.30 + 0.55 * ((s - 0.5) / 0.5)) + ")"
          : "rgba(" + WIRE + "," + (0.38 * e) + ")";
        ctx.beginPath();
        ctx.moveTo(hub.x, hub.y);
        ctx.lineTo(hub.x + (ex - hub.x) * e, hub.y + (ey - hub.y) * e);
        ctx.stroke();
      }
    }

    // ---- edges: one code path, grown in and then simply full ------------
    for (let c = 0; c < 3; c++) {
      const P = cols[c], Q = cols[c + 1];
      for (let i = 0; i < P.length; i++) {
        const p = clamp01((t - (T.edgeStart[c] + i * T.edgeStep)) / T.edgeIn);
        if (p <= 0) continue;
        const e = outCubic(p);
        ctx.strokeStyle = "rgba(" + WIRE + "," + (0.10 * e) + ")";
        ctx.lineWidth = 1;
        ctx.beginPath();
        for (let j = 0; j < Q.length; j++) {
          ctx.moveTo(P[i].x, P[i].y);
          ctx.lineTo(P[i].x + (Q[j].x - P[i].x) * e,
                     P[i].y + (Q[j].y - P[i].y) * e);
        }
        ctx.stroke();
        const s = A[c][i] || 0;
        if (s > 0.5) {
          ctx.strokeStyle = "rgba(" + HOT + "," + (0.09 + 0.30 * ((s - 0.5) / 0.5)) + ")";
          ctx.beginPath();
          for (let j = 0; j < Q.length; j++) {
            ctx.moveTo(P[i].x, P[i].y); ctx.lineTo(Q[j].x, Q[j].y);
          }
          ctx.stroke();
        }
      }
    }

    // ---- pulses ----------------------------------------------------------
    if (live > 0.5) spawn(A, dt);
    for (let k = pulses.length - 1; k >= 0; k--) {
      const p = pulses[k];
      p.t += dt / PULSE_LIFE;
      if (p.t >= 1) { pulses.splice(k, 1); continue; }
      const a = cols[p.c][p.i], b = cols[p.c + 1][p.j];
      const head = p.t, tail = Math.max(0, p.t - 0.22);
      const hx = a.x + (b.x - a.x) * head, hy = a.y + (b.y - a.y) * head;
      const tx = a.x + (b.x - a.x) * tail, ty = a.y + (b.y - a.y) * tail;
      const fade = Math.sin(Math.PI * p.t);
      const grad = ctx.createLinearGradient(tx, ty, hx, hy);
      grad.addColorStop(0, "rgba(" + HOT + ",0)");
      grad.addColorStop(1, "rgba(" + HOT + "," + (0.92 * fade) + ")");
      ctx.strokeStyle = grad;
      ctx.lineWidth = 2.1;
      ctx.beginPath(); ctx.moveTo(tx, ty); ctx.lineTo(hx, hy); ctx.stroke();
      ctx.fillStyle = "rgba(" + HEAD + "," + (0.95 * fade) + ")";
      ctx.beginPath(); ctx.arc(hx, hy, 2.6, 0, 7); ctx.fill();
    }

    // ---- nodes -----------------------------------------------------------
    for (let c = 0; c < cols.length; c++) {
      for (let i = 0; i < cols[c].length; i++) {
        const p = clamp01((t - (T.colStart[c] + i * T.nodeStep[c])) / T.nodeIn);
        if (p <= 0) continue;
        const node = cols[c][i];
        const s = Math.max(0, Math.min(1, A[c][i] || 0));
        const r = node.r * outBack(p) * (1 + 0.16 * s);
        if (s > 0.05) {
          ctx.fillStyle = "rgba(" + HOT + "," + (0.12 + 0.74 * s) + ")";
          ctx.beginPath(); ctx.arc(node.x, node.y, Math.max(0.5, r), 0, 7); ctx.fill();
        }
        ctx.strokeStyle = s > 0.35
          ? "rgba(" + HEAD + "," + (0.55 + 0.45 * s) + ")"
          : "rgba(" + COOL + "," + (0.20 + 0.52 * p) + ")";
        ctx.lineWidth = 1.6;
        ctx.beginPath(); ctx.arc(node.x, node.y, Math.max(0.5, r), 0, 7); ctx.stroke();
      }
    }

    // ---- output labels ---------------------------------------------------
    const lp = clamp01((t - T.labelAt) / 0.7);
    if (lp > 0) {
      ctx.font = '400 17px "IBM Plex Mono", ui-monospace, monospace';
      ctx.textBaseline = "middle";
      ctx.textAlign = "left";
      ctx.fillStyle = "rgba(230,235,245," + lp + ")";
      for (let i = 0; i < OUT; i++) {
        const node = cols[3][i];
        ctx.fillText(OUT_LABELS[i], node.x + 30 + (1 - outCubic(lp)) * 10, node.y);
      }
    }
  }

  function tick(now) {
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    const t = (now - t0) / 1000;
    // the run only advances once the diagram is live, so frame 0 lands
    // exactly on the handover and stays in step with a --live capture
    if (playing && t >= T.liveAt) {
      acc += dt * RATE * PLAY_RATE;
      while (acc >= 1) { frame = (frame + 1) % N; acc -= 1; }
    }
    draw(t, playing ? dt : 0);
    requestAnimationFrame(tick);
  }

  function replay() {
    t0 = performance.now(); last = t0;
    frame = 0; acc = 0; pulses.length = 0; spawnClock = 0;
  }
  addEventListener("click", replay);
  addEventListener("keydown", e => {
    if (e.code === "Space") { e.preventDefault(); replay(); }
    if (e.code === "KeyP") { playing = !playing; }
  });
  requestAnimationFrame(tick);
})();
</script>
