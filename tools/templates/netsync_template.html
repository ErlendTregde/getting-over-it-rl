<title>Weights Only</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400&display=swap">
<style>
  /* Built to be filmed and composited with the game capture: pure black so it
     luma-keys, no chrome, single theme on every host. */
  :root { --ground: #000000; --ink: #e6ebf5; }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--ground);
    color: var(--ink);
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    overflow: hidden;
  }
  canvas { display: block; width: 100%; height: 100%; }
</style>

<canvas id="net"></canvas>

<script id="cap" type="application/json">/*__DATA__*/</script>
<script>
(function () {
  "use strict";
  const D = JSON.parse(document.getElementById("cap").textContent);
  const F = D.frames, N = F.length;
  const NB = D.rays_body;

  // No pot here on purpose: this page is filmed BESIDE the operator's own
  // capture of the game, so the player belongs in that footage rather than
  // being drawn twice. Both come from the same `netcap --live` run at 30 fps,
  // so lining up frame 0 in the editor is the whole of the sync.

  // ---- what to draw -----------------------------------------------------
  // The real network is 44 -> 256 -> 256 -> 2. Drawing all of it is an
  // unreadable wall, so this is a true subset: 8 of the 16 body rays (every
  // other one, so the fan stays evenly covered), 2 state inputs, and the 10
  // hidden units per layer that vary most over the clip.
  const RAY_IN = 8, HID = 10, OUT = 2;
  const IN = RAY_IN + 2;
  const rayPick = [];
  for (let i = 0; i < RAY_IN; i++) rayPick.push(Math.round(i * NB / RAY_IN));
  const hidPick = [];
  for (let i = 0; i < HID; i++) hidPick.push(Math.round(i * D.shown / HID));
  const OUT_LABELS = ["mouse x", "mouse y"];

  // Accent sampled from the pot itself: its brightest warm tone is #E39B58
  // (hammer handle and lit skin), its average #906D36. Amber in that family
  // keeps the signal reading as part of the same picture instead of a red
  // overlay dropped on top of it.
  const HOT = "240,166,75";        // #F0A64B  the firing colour
  const HEAD = "255,214,150";      // #FFD696  the bright head of a pulse
  const COOL = "170,182,208";      // idle node ring
  const WIRE = "150,168,205";      // the quiet lattice


  const cv = document.getElementById("net");
  let ctx, W = 0, H = 0, cols = [];

  function fit() {
    const r = cv.getBoundingClientRect();
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    cv.width = Math.max(1, Math.round(r.width * dpr));
    cv.height = Math.max(1, Math.round(r.height * dpr));
    ctx = cv.getContext("2d");
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    W = r.width; H = r.height;
    layout();
  }

  function layout() {
    const gap = Math.min(44, (H - 100) / Math.max(IN, HID));
    const xs = [W * 0.135, W * 0.385, W * 0.635, W * 0.865];
    const counts = [IN, HID, HID, OUT];
    const radii = [10, 12, 12, 16];
    const spacing = [gap, gap, gap, gap * 2.6];
    cols = counts.map((n, c) => {
      const s = spacing[c];
      const top = H / 2 - ((n - 1) * s) / 2;
      const pts = [];
      for (let i = 0; i < n; i++) pts.push({ x: xs[c], y: top + i * s, r: radii[c] });
      return pts;
    });

  }
  addEventListener("resize", fit);
  fit();

  // ---- per-frame activations, all 0..1 ----------------------------------
  const SPEED_REF = 12;
  function acts(f) {
    const rays = rayPick.map(i => 1 - f.rays[i]);        // near wall = strong
    const speed = Math.min(1, Math.hypot(f.vel[0], f.vel[1]) / SPEED_REF);
    const swing = Math.min(1, Math.abs(f.tip[0]) / 3.2);
    return [
      rays.concat([speed, swing]),
      hidPick.map(i => f.h1[i]),
      hidPick.map(i => f.h2[i]),
      f.act.map(v => Math.abs(v))
    ];
  }

  // ---- firing pulses ----------------------------------------------------
  // A travelling bright segment along one weight. Signal moving through the
  // net reads far better in motion than a static red line does, and it is
  // spawned in proportion to how hard a node is actually firing.
  const pulses = [];
  const PULSE_LIFE = 2.6;      // seconds for one pulse to cross a layer
  const MAX_PULSES = 2;        // at most this many travelling at once
  const SPAWN_RATE = 0.85;     // attempts per second, before activation
  let spawnClock = 0;

  function spawn(A, dt) {
    if (pulses.length >= MAX_PULSES) return;
    spawnClock += dt * SPAWN_RATE;
    if (spawnClock < 1) return;
    spawnClock = 0;
    // pick among the nodes actually firing, weighted by how hard, so the
    // pulse always leaves somewhere the agent is really reacting
    const cand = [];
    for (let c = 0; c < 3; c++) {
      for (let i = 0; i < cols[c].length; i++) {
        const s = A[c][i] || 0;
        if (s >= 0.55) cand.push({ c: c, i: i, w: s });
      }
    }
    if (!cand.length) return;
    let total = 0;
    for (const k of cand) total += k.w;
    let r = Math.random() * total;
    for (const k of cand) {
      r -= k.w;
      if (r <= 0) {
        pulses.push({ c: k.c, i: k.i,
                      j: Math.floor(Math.random() * cols[k.c + 1].length),
                      t: 0 });
        return;
      }
    }
  }

  function edges(A, B, av) {
    ctx.strokeStyle = "rgba(" + WIRE + ",0.10)";
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (let i = 0; i < A.length; i++) {
      for (let j = 0; j < B.length; j++) {
        ctx.moveTo(A[i].x, A[i].y);
        ctx.lineTo(B[j].x, B[j].y);
      }
    }
    ctx.stroke();
    // whole bundles from a strongly firing node glow, as a base under pulses
    for (let i = 0; i < A.length; i++) {
      const s = av[i] || 0;
      if (s <= 0.5) continue;
      ctx.strokeStyle = "rgba(" + HOT + "," + (0.09 + 0.30 * ((s - 0.5) / 0.5)) + ")";
      ctx.beginPath();
      for (let j = 0; j < B.length; j++) {
        ctx.moveTo(A[i].x, A[i].y);
        ctx.lineTo(B[j].x, B[j].y);
      }
      ctx.stroke();
    }
  }

  let frame = 0, playing = true, acc = 0, last = performance.now();
  const RATE = 30;

  function draw(dt) {
    const f = F[frame], A = acts(f);
    ctx.clearRect(0, 0, W, H);


    // ---- the network -----------------------------------------------------
    for (let c = 0; c < 3; c++) edges(cols[c], cols[c + 1], A[c]);

    spawn(A, dt);
    for (let k = pulses.length - 1; k >= 0; k--) {
      const p = pulses[k];
      p.t += dt / PULSE_LIFE;
      if (p.t >= 1) { pulses.splice(k, 1); continue; }
      const a = cols[p.c][p.i], b = cols[p.c + 1][p.j];
      const head = p.t, tail = Math.max(0, p.t - 0.22);
      const hx = a.x + (b.x - a.x) * head, hy = a.y + (b.y - a.y) * head;
      const tx = a.x + (b.x - a.x) * tail, ty = a.y + (b.y - a.y) * tail;
      const fade = Math.sin(Math.PI * p.t);       // in and out, no popping
      // a soft trail behind the head, so a slow pulse still reads as motion
      const grad = ctx.createLinearGradient(tx, ty, hx, hy);
      grad.addColorStop(0, "rgba(" + HOT + ",0)");
      grad.addColorStop(1, "rgba(" + HOT + "," + (0.92 * fade) + ")");
      ctx.strokeStyle = grad;
      ctx.lineWidth = 2.1;
      ctx.beginPath(); ctx.moveTo(tx, ty); ctx.lineTo(hx, hy); ctx.stroke();
      ctx.fillStyle = "rgba(" + HEAD + "," + (0.95 * fade) + ")";
      ctx.beginPath(); ctx.arc(hx, hy, 2.6, 0, 7); ctx.fill();
    }

    // ---- nodes -----------------------------------------------------------
    for (let c = 0; c < cols.length; c++) {
      for (let i = 0; i < cols[c].length; i++) {
        const p = cols[c][i];
        const s = Math.max(0, Math.min(1, A[c][i] || 0));
        const r = p.r * (1 + 0.16 * s);
        if (s > 0.05) {
          ctx.fillStyle = "rgba(" + HOT + "," + (0.12 + 0.74 * s) + ")";
          ctx.beginPath(); ctx.arc(p.x, p.y, r, 0, 7); ctx.fill();
        }
        ctx.strokeStyle = s > 0.35
          ? "rgba(" + HEAD + "," + (0.55 + 0.45 * s) + ")"
          : "rgba(" + COOL + ",0.72)";
        ctx.lineWidth = 1.6;
        ctx.beginPath(); ctx.arc(p.x, p.y, r, 0, 7); ctx.stroke();
      }
    }

    ctx.font = '400 17px "IBM Plex Mono", ui-monospace, monospace';
    ctx.textBaseline = "middle";
    ctx.textAlign = "left";
    ctx.fillStyle = "#e6ebf5";
    for (let i = 0; i < OUT; i++) {
      const p = cols[3][i];
      ctx.fillText(OUT_LABELS[i], p.x + 30, p.y);
    }
  }

  function tick(now) {
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    if (playing) {
      acc += dt * RATE;
      while (acc >= 1) { frame = (frame + 1) % N; acc -= 1; }
    }
    draw(playing ? dt : 0);
    requestAnimationFrame(tick);
  }
  addEventListener("click", () => { playing = !playing; });
  addEventListener("keydown", e => {
    if (e.code === "Space") { e.preventDefault(); playing = !playing; }
    if (e.code === "ArrowRight") { frame = (frame + 1) % N; }
    if (e.code === "ArrowLeft") { frame = (frame + N - 1) % N; }
  });
  requestAnimationFrame(tick);
})();
</script>
