[project]
name = "goibridge"
version = "0.1.0"
description = "An agent that climbs the mountain in Getting Over It with Bennett Foddy"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.5.2",
    "torch>=2.13.0",
]

# The default PyPI wheel is CPU-only. This machine has a CUDA-capable GPU
# (GTX 1660, driver 616.56) that SAC's gradient updates were never using --
# measured at 23ms/update on CPU, which alone caps training at ~86 steps/s
# and matches the throughput observed all day regardless of rendering or
# frame-rate settings. Pulling the CUDA build routes torch there instead.
[tool.uv.sources]
torch = [
    { index = "pytorch-cu126", marker = "sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true
